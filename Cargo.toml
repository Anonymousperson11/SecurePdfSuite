[workspace]
resolver = "3"
members = [
    "crates/secure_pdf_core",
    "crates/winui3",
    "crates/secure_pdf_creator",
    "crates/secure_pdf_reader",
    "crates/secure_pdf_installer",
]

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["SecurePdfSuite Contributors"]

[workspace.dependencies]
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif"] }
secure_pdf_core = { version = "2.0.0", path = "crates/secure_pdf_core" }
tempfile = "3.24.0"
windows-collections = { version = "0.100.0", default-features = false, features = ["std"] }
windows-core = { version = "0.100.0", default-features = false, features = ["std"] }
windows-future = { version = "0.100.0", default-features = false, features = ["std"] }
windows-implement = "0.100.0"
windows-numerics = { version = "0.100.0", default-features = false }
windows-reference = { version = "0.100.0", default-features = false, features = ["std"] }
windows-result = { version = "0.100.0", default-features = false, features = ["std"] }
windows-threading = { version = "0.100.0", default-features = false }
windows-time = { version = "0.100.0", default-features = false }
winui3 = { version = "2.0.0", path = "crates/winui3" }
zeroize = { version = "1.8.2", features = ["derive"] }

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
non_ascii_idents = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_import_braces = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Duplicate transitive crate versions are gated in deny.toml with explicit skip reasons.
multiple_crate_versions = "allow"
# Desktop EXEs and internal workspace libraries are not published on crates.io.
cargo_common_metadata = "allow"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
dbg_macro = "deny"
expect_used = "deny"
float_cmp_const = "deny"
fn_params_excessive_bools = "deny"
lossy_float_literal = "deny"
multiple_unsafe_ops_per_block = "deny"
panic = "deny"
struct_excessive_bools = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"
