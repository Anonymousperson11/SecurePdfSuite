name: Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # cargo-deny-action is a Docker action and therefore only runs on Linux runners.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: dtolnay/rust-toolchain@stable
      - name: Third-party notices are in sync with Cargo.lock
        run: python3 scripts/gen-notices.py --check

  # Same steps as scripts/check.sh, which is the single source of truth for the gate.
  windows-gate:
    runs-on: windows-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Full gate (fmt, notices, deny, clippy, tests, release build, packaging, installer self-test)
        shell: bash
        run: ./scripts/check.sh
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            target/dist/SecurePdfReaderSetup.exe
            target/dist/SecurePdfCreatorSetup.exe
            target/dist/*.selftest.log
          if-no-files-found: error
